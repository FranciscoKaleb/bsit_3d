<!DOCTYPE html>
<html lang="en">
<head>

<title>Class Roster</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<body class="card-page">
  <article class="index-card welcome-card">
    <div class="card-eyebrow">
      <span>SEC. A · 034 ENTRIES ON FILE</span>
      <span>CLASS ROSTER</span>
    </div>
    <h1 class="card-name">Select a name to open its card</h1>
    <p class="card-sub">Browse the drawer on the left, or search by surname</p>
    <div class="card-red-rule"></div>
    <div class="card-lines">
      <p class="card-body-text">Every entry in this drawer is currently blank.
      Click any name in the roster to open that person&rsquo;s card &mdash;
      each one is ready to be filled in.</p>
    </div>
  </article>
